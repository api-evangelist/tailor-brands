note: >-
  Tailor Brands publishes a Model Context Protocol page — HTTP 200, title "Model Context
  Protocol (Beta) - Tailor Brands" — but it is an APPLICATION FORM, not a server. The page
  offers "early access to Tailor Brands' MCP and LLM integrations" and collects full name,
  company, work email and expected monthly volume. It names no endpoint URL, no transport,
  no install command, no package and no tools. Direct probes of mcp.tailorbrands.com (DNS
  does not resolve), https://api.tailorbrands.com/mcp (404) and https://www.tailorbrands.com/mcp
  with a JSON-RPC tools/list POST (returns the marketing HTML page, not JSON-RPC) all miss.
  No tool list could be derived either: there is no OpenAPI for this provider to derive
  candidate tools from. Because no server an agent can reach exists, NO `MCPServer` pointer
  is emitted — emitting one would credit Tailor Brands with an agent surface it has not yet
  shipped. Re-probe when the beta opens.
