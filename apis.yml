apis:
- aid: tailor-brands-embedded
  name: Tailor Embedded API
  description: >-
    Tailor Embedded gives partner platforms programmatic access to Tailor Brands' business
    formation and compliance engine — LLC formation, EIN issuance, registered agent service
    and annual reports — so SaaS providers, fintechs, marketplaces, website builders and
    accounting tools can offer formation and compliance inside their own product. The
    company describes it as cloud-native and API-first, with JSON:API compliant endpoints,
    real-time webhooks and native idempotency for reliable execution of legal filings and
    state submissions. Launched 2026-01-13; available by early access to select partners.
    The API host api.tailorbrands.com is live and every /v1/ path answers HTTP 401 demanding
    an Authorization or X-API-Key header, but no public reference or OpenAPI is published.
  humanURL: https://www.tailorbrands.com/embedded
  baseURL: https://api.tailorbrands.com/v1
